<style>
:root{--bg:#000;--cd:#000;--c2:#161616;--ln:#2a2a2a;--tx:#f5f5f7;--mu:#8e8e93;--tl:#fafaf8;--ink:#15151a;--ac:#e8f04a;--r:#e0453c;--g:#17935a;--b:#2d6bd6;--at:var(--ac);--ts:rgba(0,0,0,.08);box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}@supports(height:100dvh){html,body{height:100dvh!important}}
*{box-sizing:border-box;margin:0}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--tx);font:500 13px/1.2 -apple-system,"SF Pro Text",Inter,system-ui,sans-serif;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#app{position:fixed;inset:0;display:grid;grid-template-rows:auto minmax(0,1fr) auto auto;gap:6px;padding:max(6px,env(safe-area-inset-top)) max(12px,env(safe-area-inset-right)) max(6px,env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left))}
#top{display:flex;gap:8px;align-items:flex-start}
.pl{flex:1;display:flex;gap:8px;align-items:center;background:var(--cd);border-radius:14px;padding:6px 8px;border:1.5px solid var(--ln);min-width:0}
.pl.on,.me.on{border-color:var(--at)}
.av{width:32px;height:32px;border-radius:50%;background:var(--c2);display:grid;place-items:center;font-size:19px;position:relative;flex:none}
.bd{position:absolute;right:-4px;bottom:-4px;width:16px;height:16px;border-radius:50%;background:var(--bg);color:var(--at);font-size:9px;font-weight:700;display:grid;place-items:center}
.nm span{color:var(--mu);font-size:11px}.nm b{display:block;font-size:15px}
.opp{flex:1;display:flex;flex-direction:column;gap:6px;min-width:0}.pl{flex:none}.om{display:flex;flex-wrap:wrap;gap:4px 10px;padding:0 4px}.g3.new .t{box-shadow:0 0 0 2px var(--ac)}
.g3{display:flex;gap:1px}
.ctl{display:flex;flex-direction:column;gap:6px;align-items:flex-end;color:var(--mu);font-size:11px}
.t{--w:38px;width:var(--w);height:calc(var(--w)*1.36);border-radius:calc(var(--w)*.2);background:var(--tl);color:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:calc(var(--w)*.52);font-weight:600;line-height:1;flex:none;transition:transform .15s;box-shadow:inset 0 0 0 1px var(--ts)}
.t svg{width:100%;height:100%;display:block}.t{position:relative}.ix{position:absolute;left:calc(var(--w)*.09);top:calc(var(--w)*.05);font:700 calc(var(--w)*.25)/1 system-ui;font-style:normal;color:#6b6b70;pointer-events:none}.t.bk .ix{display:none}
.t.xs{--w:22px}.t.s{--w:var(--ps,24px)}.t.m{--w:30px}
.r{color:var(--r)}.g{color:var(--g)}.b{color:var(--b)}.w{opacity:.35}
.t.last,.t.hit{box-shadow:0 0 0 2px var(--at)}
#pool{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));grid-template-rows:minmax(0,1fr);gap:6px;min-height:0}
.pile{position:relative;border:1.5px solid var(--ln);border-radius:14px;padding:5px;display:flex;flex-wrap:wrap;gap:2px;align-content:flex-start;overflow:hidden;min-height:0;min-width:0;transition:border-color .2s}.pile.on{border-color:var(--at)}.pile .lb{position:absolute;right:6px;bottom:3px;font-size:14px;opacity:.5;pointer-events:none}
.bot{display:flex;align-items:flex-end;gap:10px}
#mel{display:flex;gap:8px;align-items:flex-end}
#hand{flex:1;display:flex;gap:3px;padding-top:12px;min-width:0}
#hand .t{--w:calc(min(46px,(100vw - 215px)/var(--hn,14.6))*var(--z,1));cursor:pointer}
#hand .t.sel{transform:translateY(-12px)}.t.bn{opacity:.95}.g3.bz{margin-left:6px}#hand .t.dim{opacity:.4}.ms{font-style:normal;font-size:10px;font-weight:700;color:var(--at);border:1px solid var(--at);border-radius:6px;padding:0 4px;margin-left:5px;vertical-align:1px}.ms.w{color:var(--mu);border-color:var(--ln)}.qs{display:flex;flex-direction:column;gap:8px;margin:12px 0}.qs .bt{display:flex;align-items:center;gap:10px;padding:10px 14px;text-align:left}.qs .bt b{flex:1}.qs .bt small{opacity:.7}#hand .t.dr{margin-left:10px}
.me{width:88px;background:var(--cd);border-radius:14px;padding:8px;display:flex;flex-direction:column;align-items:center;gap:4px;border:1.5px solid var(--ln)}
.me b{font-size:15px}
.act{display:flex;align-items:center;gap:8px;min-height:38px}
#msg{flex:1;color:var(--mu)}#btns{display:flex;gap:8px}
.bt{background:var(--cd);color:var(--tx);border:1px solid var(--ln);border-radius:14px;padding:0 18px;height:38px;font:inherit;font-weight:600}
.bt.p{background:var(--ac);color:#000;border-color:var(--at)}.ctl .bt{height:26px;padding:0 12px;font-size:11px}
#ov{position:fixed;inset:0;background:rgba(0,0,0,.8);display:none;align-items:center;justify-content:center;padding:env(safe-area-inset-top,0px) 16px env(safe-area-inset-bottom,0px)}
#ov.on{display:flex}
.cd{background:var(--cd);border:1px solid var(--ln);border-radius:22px;padding:16px 22px;max-width:min(720px,94vw);max-height:100%;overflow:auto;text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center}
.cd h2{font-size:20px}.cd p{color:var(--mu)}
.tl{display:flex;flex-wrap:wrap;gap:2px;justify-content:center}.tl .g3{margin-right:8px}
.fl{width:100%;max-width:340px;font-size:12px}.fl div{display:flex;justify-content:space-between;padding:2px 0}
#rot{position:fixed;inset:0;background:var(--bg);display:none;align-items:center;justify-content:center;font-size:16px;color:var(--mu);z-index:9}
body:not(.game) #app{display:none}body.game #sh{display:none}
#sp{position:fixed;inset:0;z-index:99999;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--bg);transition:opacity .45s ease}#sp.out{opacity:0;pointer-events:none}
#sp .logo{margin:0 auto 10px}#sp .logo .t{opacity:0;animation:spd .62s cubic-bezier(.3,1.35,.5,1) forwards}#sp .logo .t:first-child{animation-delay:.08s;--r:10deg;--x:26px}#sp .logo .t:last-child{animation-delay:.26s;--r:-8deg;--x:-26px}
@keyframes spd{0%{opacity:0;transform:translateX(var(--x)) translateY(-150px) rotate(calc(var(--r) * 4))}60%{opacity:1}100%{opacity:1;transform:translateX(var(--x)) translateY(0) rotate(var(--r))}}
#sp .wm,#sp p{opacity:0;animation:spf .5s ease .62s forwards}#sp p{animation-delay:.85s;letter-spacing:.3em;font-size:10px;margin:0;color:var(--mu)}@keyframes spf{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){#sp .logo .t{opacity:1;transform:translateX(var(--x)) rotate(var(--r))}#sp .wm,#sp p{opacity:1}}
#sh{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
#pg{flex:1;overflow:auto;padding:12px max(18px,env(safe-area-inset-right)) 16px max(18px,env(safe-area-inset-left));display:flex;flex-direction:column;gap:14px;max-width:560px;width:100%;margin:0 auto}

.hl{display:flex;flex-direction:column;gap:6px}.hr{display:flex;align-items:center;gap:12px;background:var(--cd);border:1px solid var(--ln);border-radius:16px;padding:10px 14px;text-align:left;width:100%;color:inherit;font:inherit}.hr i{font-style:normal;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:15px;background:var(--c2);flex:none}.hr span{flex:1;min-width:0}.hr b{display:block;font-size:14px}.hr small{color:var(--mu);font-size:12px}.hr em{font-style:normal;font-weight:700;font-size:14px}.up{color:#4de08a}.dn{color:#ff7b7b}.hdl{text-align:center;font-weight:700;font-size:18px;margin:6px 0 12px}
.dtl summary{font-size:11px;letter-spacing:.08em;color:var(--mu);padding:14px 0 8px;cursor:pointer;list-style:none}.dtl summary::before{content:'▸ '}.dtl[open] summary::before{content:'▾ '}
.sg button.lk{opacity:.5}.stk{color:var(--ac)}
@media(max-height:760px){.logo{width:120px;height:78px;margin-bottom:6px}.logo .t{--w:46px;margin-left:-23px;top:2px}.logo .t:first-child{transform:translateX(20px) rotate(10deg)}.logo .t:last-child{transform:translateX(-20px) rotate(-8deg)}.wm{font-size:42px;margin:0 0 4px}.hero{padding:0}.hero p{font-size:9px}.card.sm{padding:10px 8px;gap:8px;flex-direction:row;justify-content:center;font-size:19px}.card.sm .soon{margin:0 0 0 2px;font-size:9px;padding:2px 6px}}
.sgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.si{background:var(--cd);border:1.5px solid var(--ln);border-radius:18px;padding:10px;display:flex;flex-direction:column;gap:6px;align-items:center;color:var(--tx);font:inherit;min-width:0}.si.on{border-color:var(--at)}.si span{font-size:14px;font-weight:600}.si em{font-style:normal;font-size:13px;font-weight:700;color:var(--ac)}.si.own em,.si.on em{color:var(--mu)}.si s{opacity:.55;font-weight:500}.si:active{transform:scale(.98)}
.pvw{height:64px;width:100%;display:grid;place-items:center;border-radius:12px;overflow:hidden}.pvw.big{height:110px;margin-bottom:8px}.tpv{display:block;width:100%;height:100%}.si .avp,.avp{font-size:44px;font-weight:400}.pvw.big .avp{font-size:68px}.pvw .swt{width:44px;height:44px;border-radius:50%}.pvw.big .swt{width:80px;height:80px}
.bal{display:flex;justify-content:space-between;align-items:center;background:var(--cd);border:1px solid var(--ln);border-radius:16px;padding:12px 16px}.bal span{color:var(--mu);font-size:13px}.bal b{font-size:18px}
.feat{display:flex;align-items:center;gap:14px;background:linear-gradient(135deg,var(--c2),var(--cd));border:1.5px solid var(--at);border-radius:20px;padding:12px;text-align:left;color:var(--tx);font:inherit;width:100%}.feat .pvw{width:92px;flex:none;height:72px}.feat .ft{flex:1;min-width:0}.feat small{display:block;color:var(--at);font-size:10px;font-weight:700;letter-spacing:.08em}.feat b{display:block;font-size:16px;margin:2px 0}.feat span{font-size:14px;font-weight:700;color:var(--ac)}.feat s{opacity:.55;font-weight:500;color:var(--tx)}
.shs{text-align:center}.shs .pvw{margin-left:auto;margin-right:auto;max-width:220px}
.spin{width:34px;height:34px;border-radius:50%;border:3px solid var(--c2);border-top-color:var(--ac);animation:spn 1s linear infinite;margin:4px auto 10px}@keyframes spn{to{transform:rotate(360deg)}}.qsr{text-align:center}.qsr small{display:block;margin-top:4px}.soon.off{background:var(--c2);color:var(--mu)}.mu{color:var(--mu);font-size:13px}

/* ---- phone landscape: info rail on the left, discards in a 2x2 grid, full-width hand ---- */
@media (orientation:landscape) and (max-height:520px){
 #app{grid-template-columns:196px minmax(0,1fr);grid-template-rows:minmax(0,1fr) auto auto;grid-template-areas:"rail pool" "act act" "bot bot";gap:5px 8px}
 #top{grid-area:rail;flex-direction:column;flex-wrap:nowrap;gap:3px;min-height:0;overflow:hidden;align-items:stretch}
 .ctl{order:-1;flex-direction:row;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:2px 6px;font-size:10px;line-height:1.25}.ctl>div{flex:none}.ctl span{flex:1 1 100%;order:3}
 .opp{flex:none;flex-direction:row;align-items:center;gap:5px;min-width:0}.opp .pl{flex:1 1 112px;padding:3px 6px;gap:6px;border-radius:12px;min-width:0}.opp .av{width:24px;height:24px;font-size:15px}.opp .bd{width:13px;height:13px;font-size:8px;right:-5px;bottom:-5px}.opp .nm{min-width:0}.opp .nm span{display:block;font-size:9px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.opp .nm b{font-size:13px;line-height:1.15}
 .opp{flex-direction:column;align-items:stretch;gap:2px}.opp .pl{flex:none!important}.opp .om{flex:none;min-width:0;padding:0 2px;gap:2px 5px}.opp .om:empty{display:none}.opp .om .t.xs{--w:12px}
 #pool{grid-area:pool;grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:repeat(2,minmax(0,1fr));gap:5px}
 .act{grid-area:act;min-height:36px}.bot{grid-area:bot}
 .me{width:74px;padding:5px 6px}#hand{padding-top:10px}#hand .t{--w:var(--hw,calc(min(46px,(100vw - 215px)/var(--hn,14.6))*var(--z,1)))}
}
@media (orientation:landscape) and (max-height:345px){#top{gap:2px}.opp{gap:1px}.opp .pl{padding:2px 6px!important}.opp .av{width:20px!important;height:20px!important;font-size:13px!important}.opp .nm{display:flex!important;flex-direction:row;align-items:baseline;gap:6px}.opp .nm b{display:inline!important}.ctl .bt{height:26px!important}.opp .nm span{font-size:10px!important}.opp .nm b{font-size:13px!important}.opp .om .t.xs{--w:10px}.opp .om{gap:1px 4px}.ctl .bt,.ctl button{min-height:0}}
@media (orientation:landscape) and (min-height:400px) and (max-height:520px){.opp .pl{padding:5px 8px}.opp .av{width:30px;height:30px;font-size:18px}.opp .nm span{font-size:10px}.opp .nm b{font-size:15px}#top{gap:6px}.opp .om .t.xs{--w:14px}}

 subtitles on the tiles, like numbers on the Chinese-numeral tiles, and E/S/W/N and dragon colours?": "要在牌上顯示小的英文字幕嗎？例如中文數字牌上的阿拉伯數字，以及E/S/W/N和三元牌的顏色。", "YOUR OPPONENTS · MIX A HARD AND EASY TABLE": "你的對手 · 混合困難與簡單的牌桌", "Yes, show English": "好，顯示英文", "You": "你", "You are one tile from winning, which is called being ready. Any Green Dragon (發) completes the pair. Watch the discards!": "你只差一張就胡了，這叫做聽牌。任何一張發財（發）都能湊成眼。留意別人打的牌！", "You are three tiles from ready and Auntie Liu has shown three sets. What now?": "你離聽牌還差三張，而劉姨已亮出三組牌。怎麼辦？", "You can also make a concealed kong from four tiles in your own hand, which keeps your hand concealed. Kongs make the game shorter, because the wall shrinks faster.": "你也可以用手上的四張牌做暗槓，這樣手牌仍算門清。槓會讓牌局變短，因為牌牆縮短得更快。", "You finished": "你的名次", "You host, friends join with a code": "你開房，朋友用代碼加入", "You need": "你需要", "You need at least 1 tai to win (adjustable). Chow from your left, pung and kong from anyone.": "至少需要1台才能胡（可調整）。只能‹c›上家的牌，碰和槓可以對任何人。", "You need the minimum faan to win (3 by default). Faan are capped at 13.": "需要達到最低番數才能胡（預設3番）。番數上限為13番。", "You need the minimum fan to win (3 by default). Hands are capped at 10 fan.": "需要達到最低番數才能胡（預設3番）。牌型上限為10番。", "You win": "你胡牌了", "You win with four sets and a pair. Look at your hand: three chows, a pung of East, and a lone Green Dragon (發) that still needs a partner.": "胡牌需要四組面子加一對眼。看看你的牌：三組順子、一組東風的碰，還有一張孤零零的發財（發）還需要搭子。", "You win! 🎉": "你贏了！🎉", "Your cheat sheet": "你的速查表", "Your progress · guided by Auntie Liu 👵": "你的進度 · 由劉姨 👵 指導", "Your turn · tap a tile twice to discard": "輪到你 · 點兩下牌來打出", "away from ready, try": "離聽牌還差，建議打", "↻ Rotate your iPhone to landscape": "↻ 請將iPhone轉為橫向", "七 means 7.": "七代表7。", "發 is a dragon, so three of them score a faan.": "發是三元牌，所以三張發就能得一番。", "👵 Not that one. Tap the glowing tile.": "👵 不是那張，點選發光的牌。", "to win. Faan from every pattern in your hand add up, to a maximum of 13.": "才能胡牌。手牌中每種牌型的番數相加，上限為13番。", "or more, so aim higher with dragons, big suits and pungs.": "以上，所以要靠三元牌、大花色和碰來提高番數。", "Real games need": "正式牌局需要", "complete hand, but only": "已是完整牌型，但只有", "Waiting on": "等待", "is playing…": "正在出牌…", "won this hand. Everyone else is checked.": "人已胡牌，其餘玩家結算。", "Everyone else is checked.": "其餘玩家結算。", "you deal": "你坐莊", "deals": "坐莊", "Cancel": "取消", "OK": "好", "Back": "返回", "Reset": "重設", "Reset progress": "重設進度", "Language": "語言", "Voice call-outs": "語音叫牌", "Skip": "略過", "Pass": "過", "You win the round! 🏆": "你贏得整場牌局！🏆", "Round over": "牌局結束", "Next hand": "下一局", "Next hand ›": "下一局 ›", "Dealer": "莊家", "HONG KONG": "香港", "SINGAPORE": "新加坡", "MALAYSIA": "馬來西亞", "TAIWAN": "台灣", "SICHUAN": "四川", "Animal tiles": "動物牌", "Hand ends after": "每局結束條件", "Blood battle": "血戰到底", "First win ends": "一人胡牌即結束", "Every opponent plays at this level.": "所有對手都使用這個難度。", "Auto adjusts to your recent results.": "自動依你最近的成績調整。", "English": "English", "Portrait": "直向", "Landscape": "橫向", "A roomier table": "更寬敞的牌桌", "Big tiles, one-handed": "大牌面，單手操作", "Day 1": "第1天", "Day 2": "第2天", "Day 3": "第3天", "Day 4": "第4天", "Day 5": "第5天", "Day 6": "第6天", "Day 7": "第7天", "Claim 50": "領取50", "Hands played": "總局數", "Hands won": "胡牌局數", "Win rate": "勝率", "Hands lost": "輸掉局數", "Best hand": "最佳牌型", "Biggest win": "最大贏額", "Best streak": "最長連勝", "Win streak": "連勝紀錄", "Chips won": "贏得籌碼", "Chips lost": "輸掉籌碼", "Wins off discard": "食胡次數", "Dealt in": "放炮次數", "To play online, open Pongie from your own server address, or type your server address at the bottom of this page.": "要連線遊玩，請從你自己的伺服器位址開啟Pongie，或在本頁底部輸入伺服器位址。", "or chow (a run of three) from the player on your left.": "或‹c›上家打出的牌（三張連續）。", "Chows are not allowed in Sichuan.": "四川玩法不能吃牌。", "Each tai doubles the payout: 1 tai = 10 chips, 2 = 20, 3 = 40, 4 = 80, 5 = 160. Off a discard, the discarder pays double and the others pay once. Self-drawn, all three pay double. Limit hands (5 tai) pay double again. Kongs pay at once: 10 chips from everyone, or 20 if concealed.": "每多1台，賠付翻倍：1台=10籌碼，2台=20，3台=40，4台=80，5台=160。食胡時，打牌者付雙倍，其他人各付一份。自摸時，三家都付雙倍。滿貫牌（5台）再翻一倍。槓牌即時結算：每人付10籌碼，暗槓則每人付20。", "The base is 1, or 2 to the power of your fan (3 fan = 8 at most). Each base point is 20 chips. Off a discard, the discarder pays the base. Self-drawn, each player who has not won pays the base plus 1. Kongs pay at once: claimed 40 from the discarder, added 20 from everyone, concealed 40 from everyone.": "底分為2的番數次方（3番最高為8）。每個底分值20籌碼。食胡時由打牌者付底分。自摸時，每位未胡牌的玩家付底分加1。槓牌即時結算：明槓由打牌者付40，加槓每人付20，暗槓每人付40。", "3 faan = 8 chips · 4 = 16 · 5 = 24 · 6 = 32 · 7 = 48 · 8 = 64 · 9 = 96 · 10+ = 128. A discard win is paid by the discarder. A self-draw is paid by all three opponents, half each.": "3番=8籌碼 · 4番=16 · 5番=24 · 6番=32 · 7番=48 · 8番=64 · 9番=96 · 10番以上=128。食胡由打牌者支付；自摸由三位對手各付一半。", "📜 Faan": "📜 番數", "📜 Rules": "📜 規則", "✕ Exit": "✕ 離開", "Pungs": "碰牌次數", "Chows": "‹c›牌次數", "Wins": "胡牌", "Best": "最佳", "Hide": "收起", "Spin": "轉動", "Edit": "編輯", "Draws": "流局數", "Slow": "慢", "Fast": "快", "Self-draws": "自摸次數", "136 tiles, or 144 with the optional flower tiles. Hands are 13 tiles: four sets and a pair.": "136張牌，或加上可選的花牌共144張。每手13張：四組面子加一對眼。", "3 of 7 lessons": "3／7 課", "30 chips plus 10 per tai. Off a discard only the discarder pays. Self-drawn, all three pay. Payments with the dealer add the dealer and streak tai.": "30籌碼加每台10籌碼。食胡時只由打牌者付款。自摸時三家都付。涉及莊家的賠付要加上莊家台和連莊台。", "34 different tiles, four copies of each, make 136 tiles. Some styles add flowers, seasons and animals. You will meet them in the style lessons.": "34種牌各4張，共136張。部分玩法會加入花牌、季節牌和動物牌，你會在玩法課程中認識它們。", "5 tai (limit)": "5台（滿貫）", "A 3 tai win off a discard: what does the discarder pay?": "食胡3台時，打牌者要付多少？", "A Taiwan hand has 16 tiles: five sets and a pair. You hold 17 when you draw.": "台灣麻將每手16張牌：五組面子加一對眼。摸牌後手上有17張。", "A bigger hand": "更大的手牌", "A concealed hand is 1 tai and a self-draw is 1 tai. Together they are 3 tai.": "門清是1台，自摸是1台，兩者合計3台。", "A concealed kong pays 50 from everyone. An added kong pays 25 from everyone. A claimed kong pays 50 from the discarder.": "暗槓每人付50。加槓每人
